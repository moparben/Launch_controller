[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Build options
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; Library dependencies
lib_deps = 
    ArduinoJson@^6.21.3
    AsyncTCP@^1.1.1
    ESPAsyncWebServer@^1.2.3
    WiFi@^2.0.0
    SPIFFS@^2.0.0
    SD@^2.0.0
    SPI@^2.0.0
    Wire@^2.0.0
    DHT sensor library@^1.4.4
    Adafruit Unified Sensor@^1.1.9
    ESP32Servo@^0.13.0
    ESP32CAN@^1.0.1

; Monitor options
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload options
upload_speed = 921600

; File system
board_build.filesystem = spiffs
board_build.partitions = default.csv