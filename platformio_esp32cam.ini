[env:esp32cam_tracker]
platform = espressif32
board = esp32cam
framework = arduino

; Build options for ESP32-CAM
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCAMERA_MODEL_AI_THINKER

; Library dependencies for ESP32-CAM tracker
lib_deps = 
    ArduinoJson@^6.21.3
    ESP32Servo@^0.13.0
    ESP32_Camera@^2.0.4

; Monitor options
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload options
upload_speed = 460800

; File system
board_build.filesystem = spiffs
board_build.partitions = huge_app.csv

; Memory settings for camera operations
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio